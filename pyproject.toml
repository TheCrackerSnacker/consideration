[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consideration"
version = "0.1.0"
description = "OpenAI-compatible passthrough proxy with server-bound and client-bound plugin pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
consideration = "consideration.server:main"

[tool.setuptools]
packages = ["consideration"]

[tool.setuptools.package-data]
consideration = ["py.typed"]
